name: SafeCheck detection tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  detection-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run detection regression tests
        run: node --test tests/detection.test.cjs
